name: Apply uploaded fix

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/trigger9.txt'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct uploaded project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib
          names = [
              "fix00-0.txt","fix00-1.txt","fix00-2.txt",
              "chunk01.txt","chunk02.txt",
              "fix03-0.txt","f31-0.txt","f31-1.txt","f31-2.txt","fix03-2.txt",
              "chunk04.txt",
              "f50-0.txt","g51-0.txt","g51-1.txt","i520-0.txt",
              "k0-0.txt","k0-1.txt","j521-1.txt","j521-2.txt","h52-1.txt",
              "g51-3.txt","f50-2.txt",
          ]
          data = b"".join((pathlib.Path(".bootstrap") / n).read_bytes() for n in names)
          assert len(data) == 95088, len(data)
          assert hashlib.sha256(data).hexdigest() == "fe32b68ebca0846b91d31d383994811858453e0ef565d0373b11371189dda144"
          z = base64.b64decode(data, validate=True)
          assert hashlib.sha256(z).hexdigest() == "854e5cf7ff970be92ca8ed9aa6c151b6e898d185403de5138a8a78713f81e410"
          pathlib.Path("/tmp/factorio-planner.zip").write_bytes(z)
          PY
          unzip -t /tmp/factorio-planner.zip
          rm -rf /tmp/factorio-fix
          mkdir -p /tmp/factorio-fix
          unzip -q /tmp/factorio-planner.zip -d /tmp/factorio-fix
          shopt -s dotglob
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' --exclude='.bootstrap/' /tmp/factorio-fix/factorio-planner/ ./
          rm -rf .bootstrap

      - name: Commit uploaded fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply uploaded Factorio planner fix"
          git push
