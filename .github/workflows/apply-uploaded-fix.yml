name: Apply uploaded fix

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/chunk05.txt'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct uploaded project
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk*.txt | base64 --decode > /tmp/factorio-planner.zip
          rm -rf /tmp/factorio-fix
          mkdir -p /tmp/factorio-fix
          unzip -q /tmp/factorio-planner.zip -d /tmp/factorio-fix
          shopt -s dotglob
          cp -a /tmp/factorio-fix/factorio-planner/. .
          rm -rf .bootstrap
          rm -f .github/workflows/apply-uploaded-fix.yml

      - name: Commit uploaded fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply uploaded Factorio planner fix"
          git push
